<div class="min-h-screen flex flex-col selection:bg-primary-500 selection:text-white">
  <!-- Navbar Placeholder -->
  @if (showPublicUI()) {
    <header class="w-full bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="flex flex-col leading-none">
            <span class="font-bold text-xl tracking-tight text-primary-800">CAPITAL REAL</span>
            <span class="text-[10px] font-bold tracking-[0.2em] text-accent-500 uppercase">Inmobiliaria</span>
          </div>
        </div>
        <nav class="hidden md:flex items-center gap-8 font-medium text-sm text-slate-600">
          <a routerLink="/" class="hover:text-primary-600 transition-colors">Inicio</a>
          <a routerLink="/propiedades" routerLinkActive="text-primary-600 font-bold" class="hover:text-primary-600 transition-colors">Propiedades</a>
          <a routerLink="/agentes" routerLinkActive="text-primary-600 font-bold" class="hover:text-primary-600 transition-colors">Agentes</a>
          <a routerLink="/contacto" routerLinkActive="text-primary-600 font-bold" class="hover:text-primary-600 transition-colors">Contacto</a>
        </nav>
        <div class="flex items-center gap-4">
          @if (authService.isLoggedIn()) {
            <a routerLink="/admin/dashboard" class="text-sm font-bold text-primary-600 hover:text-primary-800 transition-colors flex items-center gap-2">
              Administrar
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
            </a>
          } @else {
            <a routerLink="/login" class="text-sm font-medium text-slate-600 hover:text-primary-600 transition-colors">Iniciar sesión</a>
          }
          <button class="bg-primary-600 hover:bg-primary-900 text-white px-4 py-2 rounded-full text-sm font-medium transition-all shadow-sm hover:shadow-md">
            Publicar Propiedad
          </button>
        </div>
      </div>
    </header>
  }

  <!-- Main Content Route -->
  <main class="flex-grow flex flex-col relative">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer Placeholder -->
  @if (showPublicUI()) {
    <footer class="bg-slate-900 text-slate-400 py-12 mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="flex flex-col leading-none text-white">
          <span class="font-bold text-lg tracking-tight">CAPITAL REAL</span>
          <span class="text-[9px] font-bold tracking-[0.2em] text-accent-400 uppercase">Inmobiliaria</span>
        </div>
        <p class="text-sm">© 2026 CAPITAL REAL INMOBILIARIA. Confianza, Respaldo, Integridad.</p>
      </div>
    </footer>
  }
</div>
