<div class="animate-fade-in-up max-w-4xl">
  <div class="mb-8 flex items-center gap-4">
    <button routerLink="/admin/agents" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" /></svg>
    </button>
    <div>
      <h1 class="text-2xl font-bold text-slate-900">{{ isEditMode() ? 'Editar Miembro' : 'Nuevo Miembro del Equipo' }}</h1>
      <p class="text-slate-500">{{ isEditMode() ? 'Actualiza los datos del agente o administrativo.' : 'Registra un nuevo agente o administrativo.' }}</p>
    </div>
  </div>

  <form (submit)="onSubmit()" class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <!-- Left Column: Image & Bio -->
    <div class="space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 text-center">
        <label class="block text-sm font-bold text-slate-700 mb-4 text-left">Foto de Perfil</label>
        <div class="relative inline-block group">
          <div class="w-32 h-32 rounded-full bg-slate-100 border-2 border-slate-200 overflow-hidden mx-auto flex items-center justify-center">
            <img *ngIf="imagePreview()" [src]="imagePreview()" class="w-full h-full object-cover" />
            <svg *ngIf="!imagePreview()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 text-slate-300"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" /></svg>
          </div>
          <button type="button" (click)="fileInput.click()" class="absolute bottom-0 right-0 p-2 bg-primary-600 text-white rounded-full shadow-lg hover:bg-primary-700 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></svg>
          </button>
          <input #fileInput type="file" (change)="onFileSelected($event)" class="hidden" accept="image/*" />
        </div>
        <p class="text-xs text-slate-400 mt-4 italic">Recomendado: 400x400px</p>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <label class="block text-sm font-bold text-slate-700 mb-2">Biografía / Perfil</label>
        <textarea [(ngModel)]="bio" name="bio" rows="4" placeholder="Breve descripción del agente..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all text-sm"></textarea>
      </div>
    </div>

    <!-- Right Column: Basic Info -->
    <div class="md:col-span-2 space-y-6">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div class="sm:col-span-2">
            <label class="block text-sm font-bold text-slate-700 mb-2">Nombre Completo</label>
            <input type="text" [(ngModel)]="name" name="name" placeholder="Ej: Juan Pérez" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
              [class.border-rose-500]="submitted() && !name()"
              required />
            <p *ngIf="submitted() && !name()" class="text-rose-500 text-xs mt-1 font-medium">El nombre es obligatorio</p>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Correo Electrónico</label>
            <input type="email" [(ngModel)]="email" name="email" placeholder="agente@capitalreal.com" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
              [class.border-rose-500]="submitted() && !email()"
              required />
            <p *ngIf="submitted() && !email()" class="text-rose-500 text-xs mt-1 font-medium">El correo es obligatorio</p>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Teléfono</label>
            <input type="text" [(ngModel)]="phone" name="phone" placeholder="+57 300 000 0000" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all" />
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Contraseña {{ isEditMode() ? '(Dejar en blanco para no cambiar)' : '' }}</label>
            <input type="password" [(ngModel)]="password" name="password" placeholder="••••••••" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all"
              [class.border-rose-500]="submitted() && !isEditMode() && !password()"
              [required]="!isEditMode()" />
            <p *ngIf="submitted() && !isEditMode() && !password()" class="text-rose-500 text-xs mt-1 font-medium">La contraseña es obligatoria</p>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-2">Función en la Empresa</label>
            <select [(ngModel)]="type" name="type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-500 transition-all">
              <option value="Agente">Solo Agente</option>
              <option value="Administrativo">Solo Administrativo</option>
              <option value="Ambos">Ambos</option>
            </select>
          </div>
        </div>

        <div class="mt-8 pt-8 border-t border-slate-100 flex gap-4">
          <button type="submit" [disabled]="isSubmitting()" class="flex-1 bg-primary-600 hover:bg-primary-700 text-white font-bold py-3 px-6 rounded-xl transition-all shadow-lg shadow-primary-200 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3">
            @if (isSubmitting()) {
              <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              <span>Procesando...</span>
            } @else {
              <span>{{ isEditMode() ? 'Guardar Cambios' : 'Registrar Miembro' }}</span>
            }
          </button>
          <button type="button" routerLink="/admin/agents" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-6 rounded-xl transition-all">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </form>
</div>
